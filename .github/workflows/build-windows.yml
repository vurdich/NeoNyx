name: Build NeoNyx for Windows

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set build version
        shell: pwsh
        run: |
          $version = "6.0.$env:GITHUB_RUN_NUMBER"
          Set-Content -Path src/version.h -Value "#pragma once`n#define NEONYX_VERSION L\`"$version\`"" -Encoding ascii

      - name: Build NeoNyx.exe
        shell: cmd
        run: |
          if not exist build mkdir build
          rc /nologo /fo build\NeoNyx.res src\NeoNyx.rc
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN src\main.cpp build\NeoNyx.res /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib comdlg32.lib shell32.lib shlwapi.lib crypt32.lib /OUT:build\NeoNyx.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build NeoNyx installer
        shell: pwsh
        env:
          NEONYX_VERSION: 6.0.${{ github.run_number }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer\NeoNyx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload NeoNyx files
        uses: actions/upload-artifact@v4
        with:
          name: NeoNyx-Windows
          path: |
            build/NeoNyx.exe
            dist/NeoNyx_Setup.exe
          if-no-files-found: error
          compression-level: 9

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: NeoNyx v6.0.${{ github.run_number }}
          make_latest: true
          files: |
            build/NeoNyx.exe
            dist/NeoNyx_Setup.exe
